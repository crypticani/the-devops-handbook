input {
  beats {
    port => 5044
  }
}

filter {
  # Try parsing JSON logs
  json {
    source => "message"
    skip_on_invalid_json => true
  }

  # Drop health check noise
  if [message] =~ /health/ {
    drop { }
  }

  # Add processed timestamp
  mutate {
    add_field => { "processed_at" => "%{@timestamp}" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
