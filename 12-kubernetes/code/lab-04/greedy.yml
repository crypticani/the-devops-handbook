apiVersion: apps/v1
kind: Deployment
metadata: {name: greedy}
spec:
  replicas: 5
  selector: {matchLabels: {app: greedy}}
  template:
    metadata: {labels: {app: greedy}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.9     # does nothing, uses nothing
          resources:
            requests: {cpu: "1500m"}           # ⭐ RESERVES 1.5 cores each
