apiVersion: v1
kind: ConfigMap
metadata: {name: api-content}
data:
  index.html: "API service — v1\n"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: web-content}
data:
  index.html: "WEB service — v1\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api, tier: backend}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api, tier: backend}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80, name: http}]
          volumeMounts: [{name: content, mountPath: /usr/share/nginx/html}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 3
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits:   {memory: 64Mi}
      volumes:
        - {name: content, configMap: {name: api-content}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web, tier: frontend}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web, tier: frontend}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80, name: http}]
          volumeMounts: [{name: content, mountPath: /usr/share/nginx/html}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 3
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits:   {memory: 64Mi}
      volumes:
        - {name: content, configMap: {name: web-content}}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: api}            # ⭐ matches POD labels, nothing else
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: web}
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http}]
