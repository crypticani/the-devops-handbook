services:
  lb:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped

  app1:
    build: .
    environment:
      - SERVER_ID=1
      - PORT=8080
    restart: unless-stopped

  app2:
    build: .
    environment:
      - SERVER_ID=2
      - PORT=8080
    restart: unless-stopped

  app3:
    build: .
    environment:
      - SERVER_ID=3
      - PORT=8080
    restart: unless-stopped
