# Minimal single-binary Tempo. Real deployments split the components and write blocks to
# object storage; the config shape is the same.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m # flush quickly so traces are queryable in seconds, not minutes

compactor:
  compaction:
    block_retention: 1h # a lab does not need yesterday's traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
