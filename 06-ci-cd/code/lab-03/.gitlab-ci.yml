# The Lab 01 pipeline, in GitLab's dialect — same application, same stages, same artefact
# discipline. Read it next to `../lab-01/.github/workflows/ci.yml`: the concepts map
# one-to-one, and knowing which name means what is the entire transferable skill.
#
# Layout it expects (copied from lab-01): src/  tests/  requirements.txt  Dockerfile
stages: [lint, test, build, scan, deploy]

default:
  image: python:3.12-slim # ⭐ every job runs IN this. There is no ambient toolchain
  interruptible: true # a new push cancels the old pipeline — saves runner minutes

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # SHA-tagged, built once, promoted — never `latest` (§2, immutable artifacts)
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

# One place that decides whether a pipeline is created at all. Without it, every push to
# every branch runs everything, which is how a free tier evaporates.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.python-cache: &python-cache
  cache:
    key:
      files: [requirements.txt] # ⭐ invalidates only when dependencies change
    paths: [.cache/pip]

lint:
  stage: lint
  <<: *python-cache
  script:
    - pip install -r requirements.txt
    - flake8 src/ tests/ --max-line-length=100
    - black --check src/ tests/

test:
  stage: test
  <<: *python-cache
  script:
    - pip install -r requirements.txt
    - pytest -q --junitxml=report.xml --cov=src --cov-report=term
  artifacts:
    when: always # ⭐ upload the report even when the job FAILED — that is when you need it
    expire_in: 1 week
    paths: [report.xml]
    reports:
      junit: report.xml # GitLab renders failures in the merge request itself

coverage-report:
  stage: test
  needs: [test] # ⭐ DAG: also what makes test's artifacts available here
  script:
    # Scenario 3 lives here: without `needs`, report.xml never arrives, and a script that
    # tolerates its absence reports success on nothing.
    - test -s report.xml || { echo "report.xml missing — the artifact did not arrive"; exit 1; }
    - python -c "import xml.etree.ElementTree as E; r=E.parse('report.xml').getroot(); print('tests:', r.get('tests'), 'failures:', r.get('failures'))"

build:
  stage: build
  image: docker:27
  services: [docker:27-dind] # Docker-in-Docker: the usual way to build images here
  variables:
    DOCKER_TLS_CERTDIR: "/certs" # omit this and dind and the client disagree about TLS
  dependencies: [] # ⭐ this job needs no upstream artifacts, so don't download them
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"

scan:
  stage: scan
  image:
    name: aquasec/trivy:0.55.2
    entrypoint: [""] # ⭐ images with their own entrypoint need this override
  dependencies: []
  script:
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE"

deploy:
  stage: deploy
  environment:
    name: production # deployment history, plus an approval gate
    url: https://example.com
  when: manual # continuous delivery, not deployment
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # ⚠️ Scenario 4: a *protected* variable is empty on an unprotected branch. Without this
    # guard the deploy would "succeed" against nothing at all.
    - test -n "${DEPLOY_TOKEN:-}" || { echo "DEPLOY_TOKEN is empty — refusing to deploy"; exit 1; }
    - echo "deploying $IMAGE to production"
