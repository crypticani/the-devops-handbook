events {}

http {
    # Log the upstream status and time — during an incident these two columns tell you
    # whether the proxy or the backend is at fault, without opening anything else.
    log_format incident '$time_iso8601 $status upstream=$upstream_status '
                        'rt=$request_time urt=$upstream_response_time $request';
    access_log /dev/stdout incident;

    upstream checkout {
        server api:8080 max_fails=0;
    }

    server {
        listen 80;

        location /healthz {
            proxy_pass http://checkout/healthz;
        }

        location / {
            proxy_pass http://checkout;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
