services:
  proxy:
    image: nginx:1.25-alpine
    ports:
      - "8888:80"
    volumes:
      - ./nginx-broken/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.crash
    command: ["python3", "-u", "backend.py"]
